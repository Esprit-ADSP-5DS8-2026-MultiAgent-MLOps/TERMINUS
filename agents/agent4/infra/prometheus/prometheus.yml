# Collecte toutes les 5 s : les fenêtres sont courtes en démo, on veut voir les changements vite.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.rules.yml     # un fichier par projet, généré par `provision`

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ml-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
