[project]
name = "agent-api-docker"
version = "0.1.0"
description = "Agent 3 de la plateforme Agentic MLOps : API FastAPI, image Docker, tests et déploiement du modèle"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "ruff>=0.5",
    "pytest>=8",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_api_docker*"]

[tool.setuptools.package-data]
agent_api_docker = ["templates/*.j2", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]          # pas les tests internes des projets d'exemple (eval/projects/*/tests)
