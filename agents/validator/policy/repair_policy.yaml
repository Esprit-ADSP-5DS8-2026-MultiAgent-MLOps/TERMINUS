# Politique du Repair et du Judge : DONNÉES (périmètre protégé, choix scientifiques, tolérance de comportement).
auto_repair_natures: [mechanical, configuration]   # logic et methodological : jamais réparés seuls, un humain tranche
metric_tolerance: 0.01                             # écart absolu de métrique avant/après au-delà duquel le comportement a « changé »
protected_paths:                                   # écriture REFUSÉE (sinon l'agent « réussit » en modifiant le test ou les données)
  - "**/*.csv"
  - "**/*.tsv"
  - "**/*.parquet"
  - "**/*.xlsx"
  - "data/**"
  - "tests/**"
  - "test/**"
  - "**/tests/**"                                   # tests imbriqués (pkg/tests/…)
  - "**/test/**"
  - "**/*.npy"
  - "**/*.npz"
  - "**/*.feather"
  - "**/test_*.ipynb"
  - "test_*.py"
  - "**/test_*.py"
  - "*_test.py"
  - "**/*_test.py"
  - "conftest.py"
  - "**/conftest.py"
scientific_patterns:                               # modification appliquée mais SIGNALÉE : approbation humaine + Judge
  - {label: model, regex: '\b[A-Z]\w*(Classifier|Regressor|Regression|SVC|SVR|Boost\w*|Forest\w*|Net)\s*\('}
  - {label: model, regex: '\bPipeline\s*\('}
  - {label: target, regex: '\b(target|label|y)\w*\s*=(?!=)'}
  - {label: metric, regex: '(scoring\s*=|primary_metric|min_threshold|_score\s*\(|\bmetrics?\s*=)'}
  - {label: evaluation_split, regex: '\b(train_test_split|test_size|StratifiedKFold|KFold|GroupKFold|cross_val\w*|stratify|shuffle)\b'}
hardcoded_metric_regex: '["''](accuracy|roc_auc|auc|f1|precision|recall|rmse|mae|r2|mse)\w*["'']\s*:\s*[-+]?\d*\.\d+'
