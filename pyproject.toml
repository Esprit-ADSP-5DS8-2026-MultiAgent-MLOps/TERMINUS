[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-mlops-validator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pandas>=2",
  "pyyaml",
  "packaging",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "bandit", "ruff"]
agent = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pandas==3.0.2",
  "scikit-learn==1.8.0",
  "numpy==2.4.4",
  "joblib==1.5.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["validator*", "agent_api_docker*"]
exclude = ["tests*", "eval*", ".venv*"]

[tool.setuptools.package-data]
agent_api_docker = ["templates/*.j2", "prompts/*.md"]