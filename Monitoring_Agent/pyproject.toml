[project]
name = "monitoring-agent"
version = "0.1.0"
description = "Agent 4 de la plateforme Agentic MLOps : monitoring, drift, diagnostic, réentraînement contrôlé"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["monitoring_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
