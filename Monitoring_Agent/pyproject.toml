[project]
name = "monitoring-agent"
version = "0.4.0"
description = "Agent 4 de la plateforme Agentic MLOps : monitoring, drift, diagnostic, réentraînement contrôlé"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyarrow>=15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pyyaml>=6",
    "langgraph>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["monitoring_agent*"]

[tool.setuptools.package-data]
monitoring_agent = ["console/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
