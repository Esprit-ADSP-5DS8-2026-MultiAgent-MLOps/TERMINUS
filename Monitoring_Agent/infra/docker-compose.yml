# Stack d'observabilité de l'Agent 4 : Prometheus (collecte + règles), Alertmanager (routage),
# Grafana (dashboards générés). La gateway tourne sur la machine hôte (port 8100).
#
#   python -m monitoring_agent provision <projet>          # génère règles + dashboard
#   docker compose -f Monitoring_Agent/infra/docker-compose.yml up -d
#   Prometheus http://localhost:9090 · Alertmanager http://localhost:9093 · Grafana http://localhost:3000

name: agent4-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: agent4-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # rechargement à chaud : POST /-/reload
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]   # joindre la gateway sur l'hôte (Linux ; natif sur Mac)
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: agent4-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: agent4-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # lecture seule sans login, pratique en démo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
